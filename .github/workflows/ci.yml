name: ci

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      COVERAGE_MIN: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LECG.sln

      - name: Build core with code analysis (warnings as errors)
        run: dotnet build LECG.Core/LECG.Core.csproj -c Release --no-restore /p:TreatWarningsAsErrors=true

      # LECG.csproj now references the Revit API via Nice3point reference-assembly packages,
      # so the full add-in (and the whole test suite) compiles on runners without Revit installed.
      - name: Build full solution
        run: dotnet build LECG.sln -c Release --no-restore /p:SkipRevitDeploy=true

      - name: Run tests
        run: dotnet test LECG.Tests/LECG.Tests.csproj -c Release --no-build --no-restore

      - name: Collect coverage
        run: dotnet test LECG.Tests/LECG.Tests.csproj -c Release --no-build --no-restore --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      - name: Publish coverage summary
        shell: pwsh
        run: |
          $coverage = Get-ChildItem -Path "." -Recurse -Filter "coverage.cobertura.xml" | Select-Object -First 1
          if (-not $coverage) {
            "## Coverage`nCoverage file not found." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }

          [xml]$xml = Get-Content $coverage.FullName
          $lineRate = [double]$xml.coverage.'line-rate'
          $linePct = [math]::Round($lineRate * 100, 2)
          "## Coverage`nLine coverage: $linePct%" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Enforce coverage threshold
        shell: pwsh
        run: |
          $coverage = Get-ChildItem -Path "." -Recurse -Filter "coverage.cobertura.xml" | Select-Object -First 1
          if (-not $coverage) {
            Write-Error "Coverage file not found."
            exit 1
          }

          [xml]$xml = Get-Content $coverage.FullName
          $lineRate = [double]$xml.coverage.'line-rate'
          $linePct = [math]::Round($lineRate * 100, 2)
          if ($linePct -lt [double]$env:COVERAGE_MIN) {
            Write-Error "Line coverage $linePct% is below threshold $env:COVERAGE_MIN%."
            exit 1
          }
